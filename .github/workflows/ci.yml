name: CI

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            command: swift test --filter StateManagement_Tests
          # StateManagement-Package is the aggregate scheme that includes the test
          # target (the StateManagement scheme is the library product only).
          # iPhone 17 matches the latest-stable Xcode on the runner; bump when Xcode does.
          - platform: iOS
            command: >-
              xcodebuild test
              -scheme StateManagement-Package
              -destination 'platform=iOS Simulator,name=iPhone 17'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Package
        run: swift build

      - name: Test (${{ matrix.platform }})
        run: ${{ matrix.command }}

  docs:
    name: Docs (warning-free)
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Docs build (warning-free)
        run: |
          set -o pipefail
          xcodebuild docbuild \
            -scheme StateManagement-Package \
            -destination 'platform=macOS' \
            2>&1 | tee docbuild.log
          if grep -q "warning:" docbuild.log; then
            echo "::error::docbuild emitted warnings — see log above"
            exit 1
          fi
